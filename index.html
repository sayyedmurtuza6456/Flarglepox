<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My BG Sound Website 🔊</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(#87CEEB, #B0E0E6);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
  }
  h1 {
    color: #fff;
    text-shadow: 2px 2px 5px #000;
  }
  button {
    background: orange;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 1.2rem;
    margin: 10px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  button:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>

<h1>🎶 Background Sound Demo 🎮</h1>

<!-- Background Music -->
<audio id="bgMusic" src="bg-sound.mp3" preload="auto" loop></audio>

<button id="playBtn">▶️ Play Music</button>
<button id="stopBtn">⏸️ Stop Music</button>

<script>
const bg = document.getElementById("bgMusic");
document.getElementById("playBtn").addEventListener("click", () => {
  bg.volume = 1.0;
  bg.currentTime = 0;
  bg.play().catch(err => console.log("Autoplay blocked:", err));
});
document.getElementById("stopBtn").addEventListener("click", () => {
  bg.pause();
});
</script>

</body>
</html>
